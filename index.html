<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MealPrep</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MealPrep">
<meta name="theme-color" content="#FBF7F0">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2F7F7A;--teal-d:#276B67;--aqua:#F6E4D8;--peach:#F6E4D8;--terra-dk:#9C4A32;--creme:#FBF7F0;--white:#FFFFFF;
  --anth:#2B3533;--grau:#5E6A67;--linie:#E6DED1;--sand:#C9A86E;--terra:#C8694B;--terra-t:#A9533A;
  --blush:#F2D3CB;--gruen:#3A7531;--gruen-h:#E1EFDB;--rot:#A8352F;--rot-h:#F8DEDB;
  --spur:#EFE9DF;--seg:#F1ECE3;--aqua-linie:#C1E0DC;--strich:#D4CBBC;--haken-leer:#B8B0A3;
  --ablage:#FAEEE6;--bowl-bg:#F3EEE5;--dim:rgba(43,53,51,0.42);
  --f-title:'Quicksand',system-ui,sans-serif;--f-text:'Nunito',system-ui,sans-serif;--f-label:'Montserrat',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--creme);color:var(--anth);font-family:var(--f-text);font-size:16px;line-height:1.5}
body{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.app{position:relative;min-height:100vh;min-height:100dvh}
.screen{padding:calc(var(--sat) + 22px) 20px calc(var(--sab) + 120px);display:flex;flex-direction:column;gap:16px}
.label{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-t)}
.h1{font-family:var(--f-title);font-weight:700;font-size:32px;line-height:1.1;color:var(--teal)}
.h2{font-family:var(--f-title);font-weight:700;font-size:22px;line-height:1.2;color:var(--anth)}
.sub{font-size:15px;color:var(--grau)}
.small{font-size:13px;color:var(--grau)}
.card{background:var(--white);border:1px solid var(--linie);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.aqua{background:var(--white);border:1px solid var(--linie)}
.card.blush{background:var(--blush);border:none}
.btn{min-height:48px;border:none;border-radius:999px;background:var(--teal);color:#fff;font-family:var(--f-title);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;width:100%}
.btn.sec{background:var(--white);color:var(--teal-d);border:1.5px solid var(--teal)}
.btn.dash{background:transparent;color:var(--teal-d);border:1.5px dashed var(--teal);border-radius:16px;font-family:var(--f-text);font-size:15px}
.ph{border:1.5px dashed var(--strich);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ph .tag{font-family:var(--f-label);font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--terra-dk);background:var(--peach);border-radius:6px;padding:3px 7px}
.row{display:flex;align-items:center;gap:12px}
/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--white);border-top:1px solid var(--linie);display:flex;align-items:flex-start;padding:6px 4px calc(var(--sab) + 4px);min-height:84px}
.tab{flex:1;min-height:52px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.tab span{font-size:11px;font-weight:600;color:var(--grau)}
.tab svg{stroke:var(--grau);stroke-width:1.8}
.tab[aria-current="page"] span{font-weight:700;color:var(--teal)}
.tab[aria-current="page"] svg{stroke:var(--teal);stroke-width:2}
.plus-wrap{flex:1;display:flex;justify-content:center}
.plus{width:58px;height:58px;margin-top:-22px;border-radius:50%;border:4px solid var(--creme);background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(43,53,51,.12)}
/* Bottom-Sheet */
.dim{position:fixed;inset:0;background:var(--dim);z-index:10;opacity:0;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--creme);border-radius:26px 26px 0 0;padding:10px 20px calc(var(--sab) + 24px);display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease-out}
.open .dim{opacity:1}.open .sheet{transform:none}
.grip{width:40px;height:5px;border-radius:999px;background:var(--strich);align-self:center;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.close{width:44px;height:44px;border:none;border-radius:50%;background:var(--spur);display:flex;align-items:center;justify-content:center}
.menu-item{width:100%;min-height:60px;border:none;border-radius:16px;background:var(--white);display:flex;align-items:center;gap:14px;padding:10px 14px;text-align:left}
.menu-item .ic{width:40px;height:40px;border-radius:12px;background:var(--aqua);display:flex;align-items:center;justify-content:center;flex:none}
.menu-item .t{font-family:var(--f-title);font-weight:700;font-size:16px;display:block}
.menu-item .s{font-size:13px;color:var(--grau);display:block}
textarea{width:100%;min-height:220px;border:1px solid var(--linie);border-radius:14px;background:var(--white);padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.45;color:var(--anth);resize:vertical}
textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
.err{background:var(--rot-h);color:var(--rot);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.ok{background:var(--gruen-h);color:var(--gruen);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
/* Toast */
.toast{position:fixed;left:20px;right:20px;bottom:calc(var(--sab) + 96px);z-index:20;background:var(--anth);color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.toast button{min-height:44px;border:none;background:transparent;color:var(--peach);font-weight:700;padding:0 12px}
.pill{min-height:44px;padding:0 14px;border:none;border-radius:999px;background:var(--aqua);color:var(--teal-d);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex:none}
.bar{height:8px;border-radius:999px;background:var(--spur);overflow:hidden}.bar>div{height:8px;border-radius:999px;background:var(--teal)}
.days{display:flex;flex-direction:column;gap:8px}
.dz{display:flex;flex-direction:column;gap:6px;padding:6px;margin:0 -6px;border-radius:20px;border:2px dashed transparent;transition:background .15s,border-color .15s}
.dz.over{border-color:var(--teal);background:var(--ablage)}
.dhead{display:flex;align-items:center;gap:8px;min-height:24px}
.dlabel{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra-t)}
.dnum{font-family:var(--f-title);font-weight:700;font-size:15px}
.today{font-family:var(--f-label);font-weight:700;font-size:10px;letter-spacing:.1em;color:#fff;background:var(--teal);border-radius:6px;padding:3px 6px}
.droptxt{display:none;margin-left:auto;font-weight:700;font-size:12px;color:var(--teal-d)}
.dz.over .droptxt{display:inline}
.dcard{background:var(--white);border:1px solid var(--linie);border-radius:18px;padding:10px 6px 10px 10px;display:flex;align-items:center;gap:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.dcard.lifted{opacity:.35}
.ghost{position:fixed;z-index:30;pointer-events:none;box-shadow:0 12px 28px rgba(43,53,51,.22);transform:rotate(-2deg) scale(1.02);opacity:.95}
body.dragging{overflow:hidden}
.dmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dname{border:none;background:none;padding:0;text-align:left;font-family:var(--f-title);font-weight:700;font-size:16px;line-height:1.25;color:var(--anth);-webkit-user-select:none;user-select:none}
.dsub{font-size:13px;color:var(--grau)}
.donelbl{display:flex;align-items:center;gap:3px;font-weight:700;font-size:12px;color:var(--gruen)}
.ibtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;border:none;background:transparent;color:var(--grau)}
.cbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--linie);background:var(--white)}
.cbtn.on{border:none;background:var(--gruen)}
.back{min-height:44px;display:flex;align-items:center;gap:2px;border:none;background:none;color:var(--teal-d);font-weight:700;font-size:16px;margin-left:-8px;padding:0 8px 0 0}
.donepill{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--gruen-h);color:var(--gruen);font-weight:700;font-size:13px}
.stp{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--teal);background:var(--white)}
.stp.fill{border:none;background:var(--teal)}
.pval{min-width:52px;text-align:center;font-family:var(--f-title);font-weight:700;font-size:28px}
.ngrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ntile{background:var(--white);border:1px solid var(--linie);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ntile.over{background:var(--rot-h);border-color:var(--rot-h)}
.nl{font-family:var(--f-label);font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--grau)}
.nv{font-family:var(--f-title);font-weight:700;font-size:21px;line-height:1}
.np{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--grau)}
.ntile.over .np{color:var(--rot);font-weight:700}
.ilist{background:var(--white);border:1px solid var(--linie);border-radius:18px;overflow:hidden}
.irow{min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--seg)}
.irow:last-child{border-bottom:none}
.tg{width:18px;height:18px;border-radius:5px;font-family:var(--f-label);font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center}
.small-btn{font-family:var(--f-text);font-size:14px;gap:6px;padding:0 10px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mday{min-height:56px;border-radius:14px;border:2px solid var(--linie);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.mday.cur{border-color:var(--teal)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding-top:2px}
.leg{display:flex;align-items:center;gap:5px;font-size:12px}
.scat{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.sbox{background:var(--white);border:1px solid var(--linie);border-radius:18px;overflow:hidden}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--seg)}
.swipe-bg{position:absolute;inset:0;background:var(--rot);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:flex-end;padding-right:18px}
.srow{position:relative;width:100%;min-height:48px;border:none;background:var(--white);display:flex;align-items:center;gap:12px;padding:8px 14px;text-align:left;color:var(--anth)}
.sname{font-weight:600;font-size:15px}
.srow.done .sname{font-weight:400;color:var(--grau);text-decoration:line-through}
.cbx{width:24px;height:24px;border-radius:7px;border:2px solid var(--teal-d);background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.cbx.on{border:none;background:var(--teal)}
.srow-e{min-height:48px;border-bottom:1px solid var(--aqua-linie);display:flex;align-items:center;gap:6px;padding:2px 14px 2px 4px}
.delb{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.delb>span{width:24px;height:24px;border-radius:50%;background:var(--rot);display:flex;align-items:center;justify-content:center}
.addrow{width:100%;min-height:48px;border:none;background:transparent;display:flex;align-items:center;gap:10px;padding:8px 14px;color:var(--teal-d);font-weight:700;font-size:15px}
.tin{width:100%;min-height:44px;border:1.5px solid var(--teal-d);border-radius:12px;padding:0 12px;font-family:var(--f-text);font-size:16px;color:var(--anth);background:#fff;outline:none}
.okb{min-height:44px;padding:0 16px;border:none;border-radius:999px;background:var(--teal);color:#fff;font-family:var(--f-title);font-weight:700;font-size:15px;flex:none}
.sqb{align-self:flex-end;width:44px;height:44px;border:none;border-radius:12px;background:var(--spur);display:flex;align-items:center;justify-content:center;flex:none}
.sqb.red{background:var(--rot-h)}
.cal{padding:8px 8px 12px;gap:6px}
.calnav{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
.calhead{min-height:44px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 10px;border-radius:12px}
.calsmall{font-family:var(--f-label);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--grau)}
.calbig{display:flex;align-items:center;gap:4px;font-family:var(--f-title);font-weight:700;font-size:17px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sday{min-height:68px;border-radius:14px;border:2px solid transparent;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0}
.sday .sw{font-family:var(--f-label);font-weight:700;font-size:10px;letter-spacing:.08em;color:var(--grau)}
.sday .sn{font-family:var(--f-title);font-weight:700;font-size:18px;line-height:1}
.sday .ss{height:12px;display:flex;align-items:center;justify-content:center}
.sday.sel{background:var(--teal);border-color:var(--teal)}.sday.sel .sw,.sday.sel .sn{color:#fff}
.today-b{border-color:var(--teal)!important}
.mgrid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mwd{text-align:center;font-family:var(--f-label);font-weight:700;font-size:10px;letter-spacing:.08em;color:var(--grau);padding:4px 0}
.mcell{min-height:44px;border:2px solid transparent;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 0}
.mcell .mn{font-family:var(--f-title);font-weight:700;font-size:15px;line-height:1}
.mcell.sel{background:var(--teal)}.mcell.sel .mn{color:#fff}
.dlink{display:flex;align-items:center;gap:14px;border:none;background:none;padding:0;width:100%;color:var(--anth)}
.brow{display:grid;grid-template-columns:76px 1fr 54px;align-items:center;gap:10px}
.btrack{height:8px;border-radius:999px;background:var(--spur);overflow:hidden}.btrack>span{display:block;height:8px;border-radius:999px}
.bpct{text-align:right;font-size:13px;display:flex;align-items:center;justify-content:flex-end;gap:2px}.bpct.over{color:var(--rot);font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--seg)}
.segb{flex:1;min-height:44px;border:none;border-radius:10px;font-weight:700;font-size:14px;background:transparent;color:var(--grau)}
.segb.on{background:#fff;color:var(--anth);box-shadow:0 1px 3px rgba(43,53,51,.12)}
.tile{text-align:left;color:var(--anth);background:#fff;border:1px solid var(--linie);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:132px}
.tile.aqua{background:var(--peach);border:none}
.tbig{font-family:var(--f-title);font-weight:700;font-size:30px;line-height:1}
.tab{padding:0}
.tab .tw{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px;border-radius:14px}
.tab[aria-current="page"] .tw{background:var(--peach)}
.tab[aria-current="page"] span{font-weight:800;color:var(--terra-dk)}
.tab[aria-current="page"] svg{stroke:var(--terra-dk);stroke-width:2.3}
.ibtn.round{border-radius:50%}
.ibtn.sec{background:var(--peach)}
.ibtn.prim{background:var(--teal)}
.fhead{position:sticky;top:0;z-index:5;background:var(--creme);border-bottom:1px solid var(--linie);padding:calc(var(--sat) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between;margin:calc(-1 * (var(--sat) + 22px)) -20px 0}
.fbody{display:flex;flex-direction:column;gap:22px;padding-top:10px}
.fin{min-height:44px;border:1.5px solid var(--linie);border-radius:12px;padding:0 12px;font-family:var(--f-text);font-size:16px;color:var(--anth);background:#fff;outline:none;width:100%}
.fin:focus{border-color:var(--teal)}
select.fin{-webkit-appearance:none;appearance:none;text-align:center}
.fimgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 6px}
.fimg{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;color:var(--anth);font-size:14px}
.fimg-r{width:88px;height:88px;border-radius:50%;border:3px solid transparent;display:flex;align-items:center;justify-content:center}
.fimg-r svg{width:76px;height:76px}
.fimg-r.on{border-color:var(--teal)}
.fdays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fday{min-height:44px;border-radius:12px;border:1.5px solid var(--linie);background:#fff;font-weight:700;font-size:14px}
.fday.on{background:var(--teal);border-color:var(--teal);color:#fff}
.frow{padding:12px;border-bottom:1px solid var(--seg);display:flex;flex-direction:column;gap:8px}
.csel{position:relative;display:flex;align-items:center}
.csel select{-webkit-appearance:none;appearance:none;min-height:36px;border:none;background:transparent;padding:0 18px 0 0;font-family:var(--f-text);font-weight:800;font-size:13px;color:var(--grau)}
.csel svg{position:absolute;right:2px;pointer-events:none}
body.formmode .tabbar{display:none}
/* Woche V2 · Agenda-Liste (03 V9) */
.wsw{padding:6px 6px 8px;gap:4px;border-radius:20px}
.wsw .calhead{flex:1;min-width:0}
.agenda{background:var(--white);border:1px solid var(--linie);border-radius:20px;overflow:hidden}
.arow{position:relative;display:flex;gap:8px;padding:8px 6px;border-bottom:1px solid var(--seg);min-height:64px;transition:background .15s}
.arow:last-child{border-bottom:none}
.arow.over{background:var(--ablage);box-shadow:inset 3px 0 0 var(--teal)}
.arow .droptxt,.openz .droptxt{position:absolute;right:14px;top:6px;margin:0}
.arow.over .droptxt,.openz.over .droptxt{display:inline}
.arow.over .afree .ibtn{visibility:hidden}
.adate{width:44px;flex:none;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:6px 0 0;min-height:48px;color:var(--anth)}
.adate .aw{font-family:var(--f-label);font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--grau);line-height:1.2}
.adate .an{font-family:var(--f-title);font-weight:700;font-size:19px;line-height:1;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.adate.today .aw{color:var(--teal-d)}.adate.today .an{background:var(--teal);color:#fff}
.abody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.adish{display:flex;align-items:center;gap:10px;min-height:56px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.adish.lifted{opacity:.35}
.abody .adish+.adish{border-top:1px solid var(--seg)}
.ghost{background:var(--white);border-radius:16px;padding:4px 6px 4px 10px}
.ckc{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ckc>span{width:24px;height:24px;border-radius:50%;border:2px solid var(--strich);display:flex;align-items:center;justify-content:center;background:#fff}
.ckc.on>span{border:none;background:var(--gruen)}
.afree{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:15px;color:var(--grau)}
.anote{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--grau);line-height:1.35;padding:2px 0 4px}
.anote span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abtn{border:none;background:none;text-align:left;min-height:36px;padding:2px 0;font-family:var(--f-text);width:100%}
.nadd{align-self:flex-start;border:none;background:none;display:flex;align-items:center;gap:4px;min-height:32px;padding:0 10px 0 0;font-family:var(--f-text);font-size:12px;font-weight:600;color:var(--grau)}
.nedit{display:flex;align-items:center;gap:8px;padding:4px 0 6px}
.nedit .tin{min-height:40px;font-size:15px;border-color:var(--teal)}
.dimg{display:flex;flex:none;touch-action:none;cursor:grab}
.adish[data-drag]{cursor:grab}
.openz{position:relative;border:1.5px dashed var(--strich);border-radius:20px;padding:10px 6px 6px 14px;display:flex;flex-direction:column;gap:2px;transition:background .15s}
.openz.over{background:var(--ablage);border-color:var(--teal)}
.openz.over .cnt{visibility:hidden}
.icbox{width:44px;height:44px;border-radius:14px;background:var(--peach);display:flex;align-items:center;justify-content:center;flex:none}
.notebox{display:flex;align-items:flex-start;gap:8px;background:var(--creme);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.libpick{width:100%;min-height:60px;border:none;border-bottom:1px solid var(--seg);background:var(--white);display:flex;align-items:center;gap:12px;padding:8px 14px;text-align:left;color:var(--anth)}
.libpick:last-child{border-bottom:none}
.libpick .t{font-family:var(--f-title);font-weight:700;font-size:15px;line-height:1.3}
/* Vorschau im Chat */
.preview .app{height:800px;min-height:0;overflow:auto;border-radius:28px;border:1px solid var(--linie)}
.preview .tabbar,.preview .dim,.preview .sheet,.preview .toast{position:absolute}
.preview .preview-frame{position:relative;width:390px;max-width:100%;margin:0 auto}

<body>
<div id="root" class="preview-frame">
<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Hauptnavigation"></nav>
<div id="layer"></div>
</div>
<script>
(function(){
'use strict';
var APP_VERSION='1.1.0-beta (M6a)';
var DATA_VERSION=3;
var KEY='mealprep_data';
var PREVIEW=document.documentElement.classList.contains('preview')||!!window.__MEALPREP_PREVIEW;
if(PREVIEW)document.documentElement.classList.add('preview');

/* ---------- Speicher ---------- */
var memStore={};
var ls={
  get:function(k){try{return localStorage.getItem(k)}catch(e){return memStore[k]||null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=v}}
};
var DEFAULT_CATS=['Obst & Gemüse','Fleisch & Fisch','Kühlregal & TK','Trockenware & Konserven','Öle & Würzen','Extras'];
var DEFAULT_KEYS=['obst','fleisch','kuehl','trocken','oele','extras'];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function emptyData(){
  return {v:DATA_VERSION,created:new Date().toISOString(),
    weeks:{},
    shop:{cats:DEFAULT_CATS.map(function(n,i){return {id:uid(),name:n,key:DEFAULT_KEYS[i],own:false,order:i}})},
    library:[],nutrition:{}};
}
/* Datenversion 3: Woche = {kw, dishes[], notes{0–6}, items[] (Einkauf dieser Woche), prevDone, check (nur gespeichert)}
   Gericht = {id, name, bild, bildManuell, day, portions, cooked, tip, items[], libId, carried}
   Einkauf-Artikel = {id, name, qty, unit, cat, dishIds[], done, fromKw} – alle Kategorien pro Woche; Offenes wandert in die aktuelle Woche (rollover) */
function newWeek(k){return {kw:k,dishes:[],notes:{},items:[],prevDone:false,created:new Date().toISOString()}}
/* Migrationen: MIGRATIONS[n] macht aus Version n die Version n+1. Nie löschen, nur ergänzen. */
var BOWL_TO_BILD={hack:'bowl',lachs:'bowl',lubia:'topf',feta:'salat',standard:'teller'};
var MIGRATIONS={
  1:function(d){
    function conv(x){x.bild=BOWL_TO_BILD[x.bowl]||guessImg(x.name||'');x.bildManuell=false;delete x.bowl;(x.items||[]).forEach(function(i){if(i.catManual==null)i.catManual=true})}
    Object.keys(d.weeks||{}).forEach(function(k){(d.weeks[k].dishes||[]).forEach(conv)});
    (d.library||[]).forEach(conv);
    ((d.shop&&d.shop.cats)||[]).forEach(function(c){var i=DEFAULT_CATS.indexOf(c.name);if(!c.key&&i>=0)c.key=DEFAULT_KEYS[i]});
    return d;
  },
  2:function(d){
    d.weeks=d.weeks||{};d.shop=d.shop||{cats:[],items:[]};d.library=d.library||[];d.nutrition=d.nutrition||{};
    var lib={};d.library.forEach(function(l){if(!l.id)l.id=uid();if(l.fav==null)l.fav=false;lib[String(l.name||'').toLowerCase()]=l.id});
    /* Wochen + Gerichte */
    Object.keys(d.weeks).forEach(function(k){
      var w=d.weeks[k];w.kw=w.kw||k;w.dishes=w.dishes||[];w.notes=w.notes||{};w.items=w.items||[];
      w.prevDone=true;/* alte Wochen wurden noch mit „Neue Woche starten“ abgeschlossen → kein Vorwochen-Hinweis für sie */
      w.dishes.forEach(function(x){x.libId=lib[String(x.name||'').toLowerCase()]||null;x.carried=false});
    });
    /* Einkaufsliste → Woche, zu der sie gehörte (gespeicherte currentWeek, sonst aktuelle KW) */
    var sk=d.currentWeek||weekKey(new Date());
    if(!d.weeks[sk]){d.weeks[sk]={kw:sk,dishes:[],notes:{},items:[],prevDone:true}}
    var sw=d.weeks[sk],byNr={};sw.dishes.forEach(function(x){byNr[x.nr]=x.id});
    (d.shop.items||[]).forEach(function(it){
      sw.items.push({id:it.id||uid(),name:it.name,qty:it.qty,unit:it.unit,cat:it.cat,done:!!it.done,dishIds:(it.dishes||[]).map(function(nr){return byNr[nr]}).filter(Boolean)});
    });
    delete d.shop.items;
    /* Nummern entfernen (erst nach der Zuordnung oben) */
    Object.keys(d.weeks).forEach(function(k){d.weeks[k].dishes.forEach(function(x){delete x.nr})});
    /* Nährwerte: alles Gespeicherte kam per Import dazu → eigen */
    Object.keys(d.nutrition).forEach(function(k){d.nutrition[k].src='eigen'});
    delete d.currentWeek;
    return d;
  }
};
function migrate(d){
  if(typeof d.v!=='number')d.v=1;
  while(d.v<DATA_VERSION){
    ls.set(KEY+'_backup_v'+d.v,JSON.stringify(d));
    var step=MIGRATIONS[d.v];
    if(!step)throw new Error('Keine Migration von Version '+d.v);
    d=step(d);d.v++;
  }
  return d;
}
var DB,readOnly=false;
function load(){
  var raw=ls.get(KEY);
  if(!raw){DB=emptyData();save();return}
  try{
    var d=JSON.parse(raw);
    if(d.v>DATA_VERSION){readOnly=true;DB=d;return}/* Daten aus neuerer App-Version: nicht überschreiben */
    DB=migrate(d);
    if(DB.v!==JSON.parse(raw).v)save();
  }catch(e){
    ls.set(KEY+'_kaputt_'+Date.now(),raw);
    DB=emptyData();save();
    toast('Daten konnten nicht gelesen werden – Sicherung angelegt');
  }
}
function save(){if(readOnly)return;DB.saved=new Date().toISOString();ls.set(KEY,JSON.stringify(DB))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ---------- Datum & KW ---------- */
function isoWeek(dt){
  var d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  var day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);
  var y=d.getUTCFullYear(),start=new Date(Date.UTC(y,0,1));
  return {year:y,week:Math.ceil(((d-start)/864e5+1)/7)};
}
function weekKey(dt){var w=isoWeek(dt);return w.year+'-W'+(w.week<10?'0':'')+w.week}
function mondayOf(key){
  var m=/^(\d{4})-W(\d{1,2})$/.exec(key);if(!m)return null;
  var y=+m[1],w=+m[2],jan4=new Date(y,0,4),day=jan4.getDay()||7;
  return new Date(y,0,4-day+1+(w-1)*7);
}
var MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
var WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
function weekRange(key){
  var a=mondayOf(key);if(!a)return key;var b=new Date(a);b.setDate(a.getDate()+6);
  return a.getMonth()===b.getMonth()?a.getDate()+'.–'+b.getDate()+'. '+MON[b.getMonth()]:a.getDate()+'. '+MON[a.getMonth()]+' – '+b.getDate()+'. '+MON[b.getMonth()];
}
function kwNum(key){return +key.split('-W')[1]}

/* ---------- Zahlen ---------- */
function num(s){if(s==null||s==='')return null;s=String(s).trim().replace(',','.');
  var f=/^(\d+)\/(\d+)$/.exec(s);if(f)return +f[1]/+f[2];var n=parseFloat(s);return isNaN(n)?null:n}
function fmt(n){if(n==null)return '';return (Math.round(n*10)/10).toLocaleString('de-DE')}

/* ---------- Import ---------- */
var UNITS={g:'g',gramm:'g',kg:'kg',ml:'ml',l:'l',liter:'l',stk:'Stk','stk.':'Stk','stück':'Stk',el:'EL',tl:'TL',pck:'Pck','pck.':'Pck',packung:'Pck',packungen:'Pck',bund:'Bund',dose:'Dose',dosen:'Dose',prise:'Prise',zehe:'Zehe',zehen:'Zehe'};
var IMG_RULES=[[/salat/i,'salat'],[/suppe|eintopf|curry|chili|dal\b|polo|topf|gulasch|ragout/i,'topf'],[/pfanne|omelett|rührei|shakshuka|gebraten|bratkartoffel|frittata/i,'pfanne'],[/wrap|burrito|taco|döner|sandwich|burger/i,'wrap'],[/bowl|poke/i,'bowl']];
function guessImg(n){for(var i=0;i<IMG_RULES.length;i++)if(IMG_RULES[i][0].test(n||''))return IMG_RULES[i][1];return 'teller'}
var CAT_RULES=[[/kokosmilch|erdnussbutter/i,'trocken'],[/hack|hähnchen|huhn|pute|rind|schwein|lamm|lachs|thunfisch|fisch|garnele|kabeljau|schinken|speck|wurst|steak|filet|bacon/i,'fleisch'],
 [/öl\b|öl$|essig|honig|sauce|soße|salz|pfeffer|gewürz|tomatenmark|curry|paste|senf|mayo|pesto|chili crisp|kurkuma|kümmel|paprikapulver|brühe|zucker|sirup/i,'oele'],
 [/feta|\beier?\b|skyr|joghurt|quark|milch|sahne|käse|mozzarella|halloumi|parmesan|gouda|butter|edamame|tofu|tzatziki|hummus|tiefkühl|\btk\b|erbsen/i,'kuehl'],
 [/reis|nudel|spaghetti|pasta|couscous|bulgur|quinoa|hafer|mehl|linsen|kichererbsen|kidney|mais|gehackte tomaten|passierte|dose|oliven|nüsse|mandeln|brot|tortilla|wraps/i,'trocken']];
function guessCatKey(n){for(var i=0;i<CAT_RULES.length;i++)if(CAT_RULES[i][0].test(n||''))return CAT_RULES[i][1];return 'obst'}
var DAYMAP={mo:0,montag:0,di:1,dienstag:1,mi:2,mittwoch:2,do:3,donnerstag:3,fr:4,freitag:4,sa:5,samstag:5,so:6,sonntag:6};
function parseItem(line,n){
  var body=line.replace(/^[-•*]\s*/,'');var cat='';
  var bar=body.lastIndexOf('|');if(bar>=0){cat=body.slice(bar+1).trim();body=body.slice(0,bar).trim()}
  var t=body.split(/\s+/),qty=null,unit='';
  var m=/^(\d+(?:[.,]\d+)?|\d+\/\d+)(x|×)?$/i.exec(t[0]||'');
  if(m){qty=num(m[1]);t.shift();if(m[2])unit='Stk';
    else if(t.length>1&&UNITS[t[0].toLowerCase()]){unit=UNITS[t[0].toLowerCase()];t.shift()}}
  var name=t.join(' ').trim();
  if(!name)throw new Error('Zeile '+n+': Zutat ohne Namen');
  return {name:name,qty:qty,unit:unit,cat:cat};
}
function parseImport(text){
  var lines=text.replace(/\r/g,'').split('\n'),out={week:null,check:'',dishes:[],extras:[],nutrition:[]},cur=null,mode=null,warn=[];
  if(!/^\s*#MEALPREP/i.test(text.trim().split('\n')[0]||''))warn.push('Erste Zeile „#MEALPREP v1“ fehlt – trotzdem gelesen.');
  lines.forEach(function(raw,i){
    var line=raw.trim(),n=i+1;if(!line||/^#/.test(line))return;
    var kv=/^([A-ZÄÖÜa-zäöü]+)\s*:\s*(.*)$/.exec(line);
    if(kv&&!/^[-•*]/.test(line)){
      var k=kv[1].toUpperCase(),v=kv[2].trim();
      if(k==='WOCHE'){var w=/(\d{4})\s*-?\s*W?\s*(\d{1,2})/i.exec(v),kw=/(?:KW)?\s*(\d{1,2})$/i.exec(v);
        if(w)out.week=w[1]+'-W'+('0'+w[2]).slice(-2);else if(kw)out.week=new Date().getFullYear()+'-W'+('0'+kw[1]).slice(-2);else throw new Error('Zeile '+n+': Woche nicht erkannt');}
      else if(k==='CHECK'){out.check=v}
      else if(k==='GERICHT'){cur={name:v,day:null,bild:null,portions:2.5,tip:'',items:[]};out.dishes.push(cur);mode='dish'}
      else if(k==='TAG'){if(!cur)throw new Error('Zeile '+n+': TAG ohne GERICHT');var d=DAYMAP[v.toLowerCase().replace('.','')];
        if(v&&d===undefined)throw new Error('Zeile '+n+': Tag „'+v+'“ unbekannt (Mo–So)');cur.day=v?d:null}
      else if(k==='BILD'||k==='BOWL'){if(!cur)throw new Error('Zeile '+n+': '+k+' ohne GERICHT');var bv=v.toLowerCase();bv=BOWL_TO_BILD[bv]||bv;if(IMG_KEYS.indexOf(bv)<0)throw new Error('Zeile '+n+': Bild „'+v+'“ unbekannt (bowl, teller, topf, salat, pfanne, wrap)');cur.bild=bv}
      else if(k==='PORTIONEN'){if(!cur)throw new Error('Zeile '+n+': PORTIONEN ohne GERICHT');var p=num(v);if(!p||p<1||p>8)throw new Error('Zeile '+n+': Portionen 1–8');cur.portions=Math.round(p*2)/2}
      else if(k==='TIPP'){if(!cur)throw new Error('Zeile '+n+': TIPP ohne GERICHT');cur.tip=v}
      else if(k==='EXTRAS'){mode='extras';cur=null}
      else if(k==='NÄHRWERT'||k==='NAEHRWERT'){out.nutrition.push(parseNutri(v,n))}
      else throw new Error('Zeile '+n+': „'+kv[1]+':“ unbekannt');
      return;
    }
    if(/^[-•*]/.test(line)){
      var it=parseItem(line,n);
      if(mode==='dish'&&cur)cur.items.push(it);else if(mode==='extras')out.extras.push(it);
      else throw new Error('Zeile '+n+': Zutat ohne GERICHT oder EXTRAS');
      return;
    }
    throw new Error('Zeile '+n+' nicht erkannt: „'+line.slice(0,40)+'“');
  });
  if(!out.dishes.length)throw new Error('Kein GERICHT gefunden');
  if(out.dishes.length>7)throw new Error('Maximal 7 Gerichte pro Woche');
  if(!out.week)out.week=weekKey(new Date());
  out.warn=warn;return out;
}
function parseNutri(v,n){
  var p=v.split('|').map(function(s){return s.trim()}),r={name:p[0],kcal:null,p:null,f:null,k:null,unitG:{}};
  if(!r.name)throw new Error('Zeile '+n+': NÄHRWERT ohne Namen');
  p.slice(1).forEach(function(s){var m;
    if((m=/^([\d.,]+)\s*kcal$/i.exec(s)))r.kcal=num(m[1]);
    else if((m=/^P\s*([\d.,]+)/i.exec(s)))r.p=num(m[1]);
    else if((m=/^F\s*([\d.,]+)/i.exec(s)))r.f=num(m[1]);
    else if((m=/^(KH|K)\s*([\d.,]+)/i.exec(s)))r.k=num(m[2]);
    else if((m=/^1\s*(\S+)\s*=\s*([\d.,]+)\s*g$/i.exec(s))){var u=UNITS[m[1].toLowerCase()]||m[1];r.unitG[u]=num(m[2])}
  });
  if([r.kcal,r.p,r.f,r.k].some(function(x){return x==null}))throw new Error('Zeile '+n+': NÄHRWERT braucht kcal, P, F, KH');
  return r;
}
function catId(name){
  var c=DB.shop.cats.find(function(c){return c.name.toLowerCase()===String(name||'').toLowerCase()});
  if(c)return c.id;
  if(!name)return DB.shop.cats.find(function(c){return c.name==='Extras'})?DB.shop.cats.find(function(c){return c.name==='Extras'}).id:DB.shop.cats[0].id;
  c={id:uid(),name:name,own:false,order:DB.shop.cats.length};DB.shop.cats.push(c);return c.id;
}
function applyImport(p){
  /* Nur noch intern (ab 1.1 nicht in der Oberfläche) – z. B. Grundlage für späteres Backup */
  var dishes=p.dishes.map(function(d){var lk=String(d.name).toLowerCase(),l=DB.library.find(function(x){return x.name.toLowerCase()===lk});
    return {id:uid(),name:d.name,bild:d.bild||guessImg(d.name),bildManuell:!!d.bild,day:d.day,portions:d.portions,cooked:false,tip:d.tip,libId:l?l.id:null,carried:false,
    items:d.items.map(function(it){return {name:it.name,qty:it.qty,unit:it.unit,cat:it.cat?catId(it.cat):suggestCatId(it.name),catManual:!!it.cat}})}});
  var w=newWeek(p.week);w.check=p.check;w.dishes=dishes;w.imported=new Date().toISOString();
  var old=DB.weeks[p.week];if(old){w.notes=old.notes||{};w.prevDone=!!old.prevDone}
  DB.weeks[p.week]=w;
  p.nutrition.forEach(function(r){r.src='eigen';DB.nutrition[r.name.toLowerCase()]=r});
  rebuildShop(w,p.extras);
  save();
}
/* Einkaufsliste einer Woche (B5/G4): gleiche Zutat + Einheit wird zusammengezählt */
function rebuildShop(w,extras){
  var map={},list=[];
  w.dishes.forEach(function(d){d.items.forEach(function(it){
    var k=it.name.toLowerCase()+'|'+it.unit;
    if(!map[k]){map[k]={id:uid(),name:it.name,qty:it.qty,unit:it.unit,cat:it.cat,dishIds:[],done:false};list.push(map[k])}
    else if(it.qty!=null)map[k].qty=(map[k].qty||0)+it.qty;
    if(map[k].dishIds.indexOf(d.id)<0)map[k].dishIds.push(d.id);
  })});
  (extras||[]).forEach(function(it){list.push({id:uid(),name:it.name,qty:it.qty,unit:it.unit,cat:catId(it.cat||'Extras'),dishIds:[],done:false})});
  w.items=list;
}

/* ---------- Nährwerte (pro 100 g · kcal, P, F, KH · Tags · Gramm pro Einheit) ---------- */
var NUTRI_BASE={
'hackfleisch':[260,18,21,0,'PF'],'rinderhack':[215,19,15,0,'PF'],'hähnchenbrust':[110,23,1.5,0,'P'],'hähnchenschenkel':[180,18,12,0,'PF'],
'putenbrust':[105,24,1,0,'P'],'lachs':[200,20,13,0,'PF'],'thunfisch':[110,25,1,0,'P',{Dose:150}],'garnelen':[80,18,1,0,'P'],'kabeljau':[80,18,0.7,0,'P'],
'schinken':[110,20,3,1,'P'],'speck':[350,14,32,0.5,'F'],'eier':[140,12.5,10,0.7,'P',{Stk:60}],
'feta':[265,17,21,1,'PF',{Pck:200}],'mozzarella':[250,18,19,1,'PF',{Pck:125}],'halloumi':[320,22,25,2,'PF',{Pck:225}],'parmesan':[390,35,28,0,'PF'],
'gouda':[360,25,28,0,'PF'],'skyr':[63,11,0.2,4,'P',{Stk:450}],'skyr vanille':[80,9,0.2,10,'P',{Stk:450}],'joghurt':[65,3.5,3.5,4.5,''],
'griechischer joghurt':[120,4,10,4,'F'],'magerquark':[70,12,0.3,4,'P'],'quark':[70,12,0.3,4,'P'],'milch':[64,3.4,3.6,4.8,''],'sahne':[300,2.4,30,3.2,'F'],
'butter':[740,0.7,83,0.6,'F',{EL:12}],'tzatziki':[120,4,10,4,'F'],'hummus':[250,7,18,12,'F',{EL:15}],
'edamame':[120,11,5,9,'P'],'tofu':[120,13,7,1.5,'P'],'kichererbsen':[120,7,2.5,16,'K',{Dose:240}],'rote linsen':[340,25,1.5,50,'PK'],'linsen':[340,25,1.5,50,'PK'],
'kidneybohnen':[100,7,0.5,14,'K',{Dose:240}],'brechbohnen':[30,2,0.2,5,''],'erbsen':[80,5.5,0.4,12,''],'mais':[85,3,1.2,15,'K',{Dose:140}],

var UNIT_G={g:1,kg:1000,ml:1,l:1000};
var UNIT_FALLBACK={EL:15,TL:5,Prise:0.5};
function nutriEntry(name){
  var n=String(name||'').toLowerCase().trim();
  var custom=DB.nutrition||{};
  function get(k){
    if(custom[k]){var c=custom[k];return {kcal:c.kcal,p:c.p,f:c.f,k:c.k,unitG:c.unitG||{},tags:tagsFor(c)}}
    var b=NUTRI_BASE[k];if(b)return {kcal:b[0],p:b[1],f:b[2],k:b[3],tags:b[4],unitG:b[5]||{}};
    return null;
  }
  var e=get(n);if(e)return e;
  var vars=[n+'n',n+'en',n+'e',n.replace(/n$/,''),n.replace(/en$/,''),n.replace(/e$/,''),n==='ei'?'eier':''];
  for(var i=0;i<vars.length;i++){if(vars[i]&&(e=get(vars[i])))return e}
  var keys=Object.keys(custom).concat(Object.keys(NUTRI_BASE)).filter(function(k){return k.length>=4&&n.indexOf(k)>=0}).sort(function(a,b){return b.length-a.length});
  return keys.length?get(keys[0]):null;
}
function tagsFor(c){return (c.p>=10?'P':'')+(c.f>=10?'F':'')+(c.k>=15?'K':'')}
function grams(it,e){
  if(it.qty==null)return null;
  if(UNIT_G[it.unit])return it.qty*UNIT_G[it.unit];
  if(e&&e.unitG&&e.unitG[it.unit])return it.qty*e.unitG[it.unit];
  if(UNIT_FALLBACK[it.unit])return it.qty*UNIT_FALLBACK[it.unit];
  return null;
}
function dishNutri(d){
  var t={kcal:0,p:0,f:0,k:0},missing=[];
  d.items.forEach(function(it){
    var e=nutriEntry(it.name),g=grams(it,e);
    if(!e||g==null){missing.push(it.name);return}
    t.kcal+=e.kcal*g/100;t.p+=e.p*g/100;t.f+=e.f*g/100;t.k+=e.k*g/100;
  });
  var pp=d.portions||2.5;
  return {total:t,per:{kcal:t.kcal/pp,p:t.p/pp,f:t.f/pp,k:t.k/pp},missing:missing};
}

function addDishToShop(d,w,pos){
  var ins=[],L=w.items||(w.items=[]);

    var ex=L.find(function(s){return !s.done&&(s.name.toLowerCase()+'|'+s.unit)===k&&s.dishIds&&s.dishIds.length});
    if(ex){if(it.qty!=null)ex.qty=(ex.qty||0)+it.qty;if(ex.dishIds.indexOf(d.id)<0)ex.dishIds.push(d.id)}
    else{var n={id:uid(),name:it.name,qty:it.qty,unit:it.unit,cat:it.cat,dishIds:[d.id],done:false};
      if(pos&&pos[k]!=null)ins.push([pos[k],n]);else L.push(n)}
  });

}

function setDay(id,day){var f=findDish(id);if(!f)return;f.dish.day=day;save();rerender()}

  var r=upsertLibrary(d);d.libId=r.id;
  save();toast(r.existed?'In der Bibliothek aktualisiert':'In der Bibliothek gespeichert');

function addFromLibrary(libId,key,day){
  var l=DB.library.find(function(x){return x.id===libId});if(!l)return;
  key=key||ctxWeek();var w=getWeek(key,true);
  if(w.dishes.length>=7){toast('Maximal 7 Gerichte pro Woche');return}
  var d={id:uid(),name:l.name,bild:l.bild||'teller',bildManuell:true,day:day==null?null:day,portions:l.portions||2.5,cooked:false,tip:l.tip||'',items:JSON.parse(JSON.stringify(l.items)),libId:l.id,carried:false};
  w.dishes.push(d);addDishToShop(d,w);save();closeSheet();
  if(route==='woche'||route==='dashboard')rerender();else{wocheUI.week=key;setRoute('woche')}
  toast(l.name+' eingeplant · '+(d.day==null?'KW '+kwNum(key)+' · Noch offen':WD[d.day]+' '+dayDate(key,d.day).getDate()+'.'));

/* Vorwochen-Hinweis (G3) */
function prevOpen(key){
  var cw=DB.weeks[key];if(cw&&cw.prevDone)return [];
  var pw=DB.weeks[addWeeks(key,-1)];if(!pw)return [];
  return pw.dishes.filter(function(d){return !d.cooked&&!d.carried});
}
function takePrev(){
  var key=todayKey(),list=prevOpen(key),w=getWeek(key,true),n=0;
  list.forEach(function(o){
    if(w.dishes.length>=7)return;
    var c=JSON.parse(JSON.stringify(o));c.id=uid();c.day=null;c.cooked=false;c.carried=false;
    /* Offene Zutaten sind schon mitgewandert (rollover) → nur umhängen, nicht doppelt eintragen */
    var have={};w.items.forEach(function(s){var ix=(s.dishIds||[]).indexOf(o.id);if(ix>=0){s.dishIds[ix]=c.id;if(!s.done)have[itemKey(s)]=1}});
    /* in der Vorwoche schon gekauft (abgehakt) → nicht nochmal auf die Liste */
    var pw=DB.weeks[addWeeks(key,-1)];(pw&&pw.items||[]).forEach(function(s){if(s.done&&(s.dishIds||[]).indexOf(o.id)>=0)have[itemKey(s)]=1});
    w.dishes.push(c);
    addDishToShop({id:c.id,items:c.items.filter(function(it){return !have[itemKey(it)]})},w);
    o.carried=true;n++;
  });
  w.prevDone=true;save();rerender();
  toast(n+(n===1?' Gericht':' Gerichte')+' übernommen'+(n<list.length?' · max. 7 pro Woche':''));
}
function dropPrev(){
  var key=todayKey(),list=prevOpen(key),w=getWeek(key,true),ids={},snap=JSON.stringify(w.items);
  list.forEach(function(o){ids[o.id]=1});
  /* mitgewanderte offene Zutaten, die nur zu verworfenen Gerichten gehören, fliegen raus */
  var gone=w.items.filter(function(s){return !s.done&&s.fromKw&&(s.dishIds||[]).length&&s.dishIds.every(function(i){return ids[i]})});
  w.items=w.items.filter(function(s){return gone.indexOf(s)<0});
  w.prevDone=true;save();rerender();
  toast('Verworfen'+(gone.length?' · '+gone.length+' Zutat(en) von der Liste':''),function(){w.items=JSON.parse(snap);w.prevDone=false;save();rerender()});
}
function saveNote(){
  var i=wocheUI.noteEdit;if(i==null)return;wocheUI.noteEdit=null;
  var inp=document.getElementById('noteIn'),v=inp?inp.value.trim():'',key=wocheUI.week,w=getWeek(key,!!v),old=w&&w.notes[i]||'';
  if(w){if(v)w.notes[i]=v;else delete w.notes[i]}
  if(v!==old)save();rerender();
  if(v!==old)toast(v?'Notiz gespeichert':'Notiz gelöscht',v?null:function(){getWeek(key,true).notes[i]=old;save();rerender()});
}

  if(wocheUI.noteEdit!=null&&wocheUI.noteEdit!==i)saveNote();
  wocheUI.noteEdit=i;rerender();var n=document.getElementById('noteIn');if(n){n.focus();var l=n.value.length;try{n.setSelectionRange(l,l)}catch(e){}}
}
function shopItems(key){var w=DB.weeks[key];return w&&w.items?w.items:[]}
function findItem(id){
  for(var k in DB.weeks){var L=DB.weeks[k].items||[],i=L.findIndex(function(x){return x.id===id});if(i>=0)return {list:L,i:i}}
  return null;
}
function pushItem(key,it){getWeek(key,true).items.push(it)}
function itemKey(s){return s.name.toLowerCase()+'|'+s.unit}
/* Einkauf (G4 neu, 17.11.): Nicht Abgehaktes aus vergangenen Wochen wandert in die aktuelle Woche; Abgehaktes bleibt in der alten Woche */
function rollover(){
  if(readOnly)return;var k=todayKey(),moved=0,cw=null;
  Object.keys(DB.weeks).filter(function(x){return x<k}).sort().forEach(function(pk){
    var pw=DB.weeks[pk],open=(pw.items||[]).filter(function(i){return !i.done});if(!open.length)return;
    cw=cw||getWeek(k,true);
    open.forEach(function(it){
      var ex=cw.items.find(function(s){return !s.done&&itemKey(s)===itemKey(it)});
      if(ex){if(it.qty!=null)ex.qty=Math.round(((ex.qty||0)+it.qty)*100)/100;ex.dishIds=(ex.dishIds||[]).concat(it.dishIds||[])}
      else{if(!it.fromKw)it.fromKw=pk;cw.items.push(it)}
      moved++;
    });
    pw.items=pw.items.filter(function(i){return i.done});
  });
  if(moved)save();
}

function removeDishFromShop(d,w){
  var L=w.items||[],pos={};L.forEach(function(s,i){if(!s.done&&s.dishIds&&s.dishIds.indexOf(d.id)>=0)pos[s.name.toLowerCase()+'|'+s.unit]=i});
  w.items=L.filter(function(s){
    if(s.done||!s.dishIds||s.dishIds.indexOf(d.id)<0)return true;
    var own=d.items.find(function(it){return it.name.toLowerCase()===s.name.toLowerCase()&&it.unit===s.unit});
    if(own&&own.qty!=null&&s.qty!=null)s.qty=Math.round((s.qty-own.qty)*100)/100;
    s.dishIds=s.dishIds.filter(function(n){return n!==d.id});
    return s.dishIds.length>0;
  });
  return pos;
}

  var entry={id:ex>=0?DB.library[ex].id:uid(),name:d.name,bild:d.bild,portions:d.portions,tip:d.tip,items:JSON.parse(JSON.stringify(d.items)),fav:ex>=0?!!DB.library[ex].fav:false,saved:new Date().toISOString()};

  toast('Kategorie „'+cat.name+'“ gelöscht',function(){var o=JSON.parse(snap);DB.shop=o.shop;o.items.forEach(function(e){if(DB.weeks[e[0]])DB.weeks[e[0]].items=e[1]});save();rerender()});
}
function catUp(id){var l=sortedCats(),i=l.findIndex(function(c){return c.id===id});if(i<=0)return;var t=l[i-1];l[i-1]=l[i];l[i]=t;renumberCats(l);save();rerender()}
function renameCat(id,v){v=v.trim();var c=DB.shop.cats.find(function(c){return c.id===id});if(!c||!v)return rerender();c.name=v;save()}
function parseManual(t){
  t=t.trim();if(!t)return null;var parts=t.split(','),line;
  if(parts.length>1){var a=parts.pop().trim().replace(/^(\d+(?:[.,]\d+)?)\s*[x×]$/i,'$1 Stk');line='- '+a+' '+parts.join(',').trim()}else line='- '+t;
  try{return parseItem(line,1)}catch(e){return {name:t,qty:null,unit:''}}
}
function addManual(catId){
  var inp=document.getElementById('addIn');if(!inp)return;var p=parseManual(inp.value);
  if(!p){shopUI.adding=null;rerender();return}
  pushItem(shopUI.week||todayKey(),{id:uid(),name:p.name,qty:p.qty,unit:p.unit,cat:catId,dishIds:[],done:false});save();rerender();
  var n=document.getElementById('addIn');if(n)n.focus();
}
function addCat(){
  var inp=document.getElementById('catIn'),v=inp?inp.value.trim():'';shopUI.addingCat=false;
  if(v)DB.shop.cats.push({id:uid(),name:v,own:true,order:DB.shop.cats.length});
  renumberCats(sortedCats());save();rerender();
}
/* Wisch nach links zum Löschen */
var sw=null;
document.addEventListener('touchstart',function(e){var r=e.target.closest('[data-swipe]');if(!r||e.touches.length>1)return;var t=e.touches[0];sw={row:r,btn:r.querySelector('.srow'),x0:t.clientX,y0:t.clientY,dx:0,mode:null}},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!sw)return;var t=e.touches[0],dx=t.clientX-sw.x0,dy=t.clientY-sw.y0;
  if(!sw.mode){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))sw.mode='h';else if(Math.abs(dy)>10){sw=null;return}else return}
  e.preventDefault();sw.dx=Math.min(0,dx);sw.btn.style.transition='none';sw.btn.style.transform='translateX('+sw.dx+'px)';
},{passive:false});
document.addEventListener('touchend',function(){
  if(!sw)return;var s=sw;sw=null;if(s.mode!=='h')return;
  suppressClick=true;setTimeout(function(){suppressClick=false},300);
  s.btn.style.transition='transform .2s';
  if(s.dx<-90){s.btn.style.transform='translateX(-100%)';setTimeout(function(){deleteItem(s.row.getAttribute('data-swipe'))},180)}
  else s.btn.style.transform='';
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!=='Escape')return;
  if(e.target.id==='addIn'){e.preventDefault();if(e.key==='Enter')addManual(e.target.getAttribute('data-addcat'));else{shopUI.adding=null;rerender()}}
  else if(e.target.id==='ingIn'){e.preventDefault();if(e.key==='Enter')addIngredient();else{detailUI.adding=null;rerender()}}
  else if(e.target.id==='quickIn'){e.preventDefault();if(e.key==='Enter')addQuick();else closeSheet()}
  else if(e.target.id==='noteIn'){e.preventDefault();if(e.key==='Enter')saveNote();else{wocheUI.noteEdit=null;rerender()}}
  else if(e.target.id==='catIn'){e.preventDefault();if(e.key==='Enter')addCat();else{shopUI.addingCat=false;rerender()}}
  else if(e.target.hasAttribute('data-rename')&&e.key==='Enter')e.target.blur();
});
document.addEventListener('change',function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-rename');if(id)renameCat(id,e.target.value)});

/* ---------- Drag & Drop (gedrückt halten + ziehen) ---------- */
var drag=null,suppressClick=false;
/* immediate = Ziehen startet bei der ersten Bewegung (Bild am iPhone, Maus am Computer); sonst erst nach kurzem Halten */
function dragStartAt(card,x,y,immediate){
  drag={id:card.getAttribute('data-drag'),card:card,x0:x,y0:y,x:x,y:y,active:false,over:null,immediate:!!immediate,
    timer:immediate?null:setTimeout(function(){activateDrag()},350)};
}
function activateDrag(){
  if(!drag)return;drag.active=true;
  var r=drag.card.getBoundingClientRect();
  var g=drag.card.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  drag.dx=drag.x0-r.left;drag.dy=drag.y0-r.top;drag.ghost=g;document.body.appendChild(g);
  drag.card.classList.add('lifted');document.body.classList.add('dragging');
  try{if(navigator.vibrate)navigator.vibrate(10)}catch(e){}
  autoScroll();
}
function dragMove(x,y){
  if(!drag)return;drag.x=x;drag.y=y;
  if(!drag.active){
    var moved=Math.abs(x-drag.x0)>4||Math.abs(y-drag.y0)>4;
    if(drag.immediate&&moved){activateDrag();if(!drag)return}
    else{if(Math.abs(x-drag.x0)>8||Math.abs(y-drag.y0)>8){clearTimeout(drag.timer);drag=null}return}
  }
  drag.ghost.style.left=(x-drag.dx)+'px';drag.ghost.style.top=(y-drag.dy)+'px';
  var el=document.elementFromPoint(x,y),z=el&&el.closest('[data-drop]');
  if(drag.over&&drag.over!==z)drag.over.classList.remove('over');
  if(z)z.classList.add('over');drag.over=z;
}
function autoScroll(){
  if(!drag||!drag.active)return;
  var sc=PREVIEW?document.getElementById('app'):null,h=sc?sc.getBoundingClientRect():{top:0,bottom:window.innerHeight};
  var v=drag.y<h.top+90?-12:drag.y>h.bottom-140?12:0;
  if(v){if(sc)sc.scrollTop+=v;else window.scrollBy(0,v);dragMove(drag.x,drag.y)}
  requestAnimationFrame(autoScroll);
}
function dragEnd(){
  if(!drag)return;clearTimeout(drag.timer);
  if(drag.active){
    suppressClick=true;setTimeout(function(){suppressClick=false},350);
    var z=drag.over,id=drag.id;drag.ghost.remove();drag.card.classList.remove('lifted');document.body.classList.remove('dragging');
    if(z){z.classList.remove('over');var v=z.getAttribute('data-drop');drag=null;setDay(id,v==='open'?null:+v);return}
  }
  drag=null;
}
document.addEventListener('touchstart',function(e){var c=e.target.closest('[data-drag]');if(!c||e.target.closest('button:not(.dname)')||e.touches.length>1)return;var t=e.touches[0];dragStartAt(c,t.clientX,t.clientY,!!e.target.closest('.dimg'))},{passive:true});
document.addEventListener('touchmove',function(e){if(!drag)return;var t=e.touches[0];dragMove(t.clientX,t.clientY);if(drag&&drag.active)e.preventDefault()},{passive:false});
document.addEventListener('touchend',dragEnd);document.addEventListener('touchcancel',dragEnd);
document.addEventListener('mousedown',function(e){if(e.button!==0)return;var c=e.target.closest('[data-drag]');if(!c||e.target.closest('button:not(.dname)'))return;e.preventDefault();dragStartAt(c,e.clientX,e.clientY,true)});
document.addEventListener('mousemove',function(e){if(drag)dragMove(e.clientX,e.clientY)});
document.addEventListener('mouseup',dragEnd);
document.addEventListener('contextmenu',function(e){if(e.target.closest('[data-drag]'))e.preventDefault()});

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  if(suppressClick){e.preventDefault();e.stopPropagation();return}
  var t=e.target,a;
  if((a=t.closest('[data-go]'))){var g=a.getAttribute('data-go'),gw=a.getAttribute('data-week');
    if(a.hasAttribute('data-tab')){if(g==='woche')wocheUI.week=todayKey();if(g==='dashboard'){dashUI.week=null;dashUI.month=false}shopUI.edit=false}
    if(g==='woche'&&gw)wocheUI.week=gw;
    setRoute(g,g==='einkauf'?gw:null);return}
  if((a=t.closest('[data-wk]'))){wocheUI.noteEdit=null;var wd=+a.getAttribute('data-wk');wocheUI.week=wd?addWeeks(wocheUI.week,wd):todayKey();rerender();return}
  if((a=t.closest('[data-swk]'))){var sd2=+a.getAttribute('data-swk');shopUI.week=sd2?addWeeks(shopUI.week,sd2):todayKey();shopUI.adding=null;rerender();return}
  if((a=t.closest('[data-noteedit]'))){startNoteEdit(+a.getAttribute('data-noteedit'));return}
  if((a=t.closest('[data-dayx]'))){openDaySheet(wocheUI.week,+a.getAttribute('data-dayx'),true);return}
  if((a=t.closest('[data-addday]'))){var ad=a.getAttribute('data-addday').split('|');openDaySheet(ad[0],+ad[1],true);return}
  if((a=t.closest('[data-open]'))){setRoute('gericht',a.getAttribute('data-open'));return}
  if((a=t.closest('[data-cook]'))){toggleCook(a.getAttribute('data-cook'));return}
  if((a=t.closest('[data-move]'))){openMove(a.getAttribute('data-move'));return}
  if((a=t.closest('[data-port]'))){changePortions(param,+a.getAttribute('data-port'));return}
  if((a=t.closest('[data-lib]'))){saveToLibrary(a.getAttribute('data-lib'));return}
  if((a=t.closest('[data-setday]'))){var dv=a.getAttribute('data-day');closeSheet();setDay(a.getAttribute('data-setday'),dv===''?null:+dv);return}
  if((a=t.closest('[data-libadd]'))){var dd=a.getAttribute('data-day');addFromLibrary(a.getAttribute('data-libadd'),a.getAttribute('data-week'),dd===''?null:+dd);return}
  if((a=t.closest('[data-fimg]'))){form.bild=a.getAttribute('data-fimg');form.bildManual=true;rerender();return}
  if((a=t.closest('[data-fday]'))){var fd=a.getAttribute('data-fday');form.day=fd===''?null:+fd;rerender();return}
  if((a=t.closest('[data-fport]'))){var np=Math.round((form.portions+(+a.getAttribute('data-fport')))*2)/2;if(np>=1&&np<=8){form.portions=np;rerender()}return}
  if((a=t.closest('[data-frem]'))){var rk=a.getAttribute('data-frem');form.items=form.items.filter(function(x){return String(x.k)!==rk});rerender();return}
  if((a=t.closest('[data-cal]'))){calStep(+a.getAttribute('data-cal'));return}
  if((a=t.closest('[data-sday]'))){dashUI.sel=+a.getAttribute('data-sday');rerender();return}
  if((a=t.closest('[data-mpick]'))){var mp=a.getAttribute('data-mpick').split('|');dashUI.week=mp[0];dashUI.sel=+mp[1];dashUI.month=false;rerender();return}
  if((a=t.closest('[data-nmode]'))){dashUI.mode=a.getAttribute('data-nmode');rerender();return}
  if((a=t.closest('[data-tick]'))){tickItem(a.getAttribute('data-tick'));return}
  if((a=t.closest('[data-itemdel]'))){deleteItem(a.getAttribute('data-itemdel'));return}
  if((a=t.closest('[data-catdel]'))){deleteCat(a.getAttribute('data-catdel'));return}
  if((a=t.closest('[data-catup]'))){catUp(a.getAttribute('data-catup'));return}
  if((a=t.closest('[data-addstart]'))){shopUI.adding=a.getAttribute('data-addstart');rerender();var ai=document.getElementById('addIn');if(ai)ai.focus();return}
  if((a=t.closest('[data-addok]'))){addManual(a.getAttribute('data-addok'));return}
  a=t.closest('[data-act]');if(!a)return;
  var act=a.getAttribute('data-act');
  if(act==='plus')openPlus();
  else if(act==='close')closeSheet();
  else if(act==='lib-pick'){var lk=ctxWeek();swapSheet(function(){openLibPick(lk,null)})}
  else if(act==='form-new'){var fdy=a.getAttribute('data-day');openForm({day:fdy==null||fdy===''?null:+fdy,week:a.getAttribute('data-week')||null})}
  else if(act==='prev-take')takePrev();
  else if(act==='prev-drop')dropPrev();
  else if(act==='note-save')saveNote();
  else if(act==='day-lib')openDaySheet(daySheet.key,daySheet.day,daySheet.noNote,!daySheet.libOpen);
  else if(act==='quick-item')swapSheet(openQuickItem);
  else if(act==='quick-ok')addQuick();
  else if(act==='ing-start'){detailUI.adding=param;rerender();var ii=document.getElementById('ingIn');if(ii)ii.focus()}
  else if(act==='ing-ok')addIngredient();
  else if(act==='form-cancel')formClose();
  else if(act==='form-save')formSave();
  else if(act==='form-delete')formDelete();
  else if(act==='form-additem'){form.items.push({k:uid(),qty:'',unit:'g',name:'',cat:null,catManual:false});rerender();var rows=document.querySelectorAll('[data-fn]');if(rows.length)rows[rows.length-1].focus()}
  else if(act==='dish-edit')openForm({edit:param});
  else if(act==='ph-edit')openPlaceholder('Gericht bearbeiten');
  else if(act==='shop-edit'){shopUI.edit=!shopUI.edit;shopUI.adding=null;shopUI.addingCat=false;rerender()}
  else if(act==='cat-start'){shopUI.addingCat=true;rerender();var ci=document.getElementById('catIn');if(ci)ci.focus()}
  else if(act==='cat-ok')addCat();
  else if(act==='cal-month')toggleMonth();
});

/* ---------- Start ---------- */
load();
if(!DB.library)DB.library=[];
rollover();
document.addEventListener('visibilitychange',function(){if(!document.hidden){var b=JSON.stringify(DB.weeks);rollover();if(JSON.stringify(DB.weeks)!==b)rerender()}});

render();
window.MealPrep={parseImport:parseImport,get data(){return DB},DATA_VERSION:DATA_VERSION,nutri:dishNutri,
  importText:function(t){applyImport(parseImport(t));render()},go:setRoute};
})();
